# OWNER: integrator (main only). P2 requests dependency changes via docs/handoffs/engine.md.
[project]
name = "tastespace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tastespace-contracts",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "xai-sdk>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
tastespace-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tastespace"]
