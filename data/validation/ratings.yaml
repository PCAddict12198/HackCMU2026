# OWNER: data (P1). Mini human-rating study (H15): each teammate rates these 20 core pairs 1-5 for
# "how similar do these taste?" WITHOUT looking at the engine. The build report computes Spearman rho.
#
# HOW TO FILL THIS IN
#   Add yourself to each pair's `ratings` map, 1 (nothing alike) to 5 (very similar):
#     - {a: shoyu_ramen, b: pho_bo, ratings: {p1: 4, p2: 3, p3: 4}}
#   Rate alone, top to bottom, before opening the app. Go on first instinct; don't revise earlier rows to
#   be consistent. Any rater key works (p1/p2/p3 or names) as long as each person uses one key throughout.
#
# The 20 pairs were chosen by P1 from the 70 core dishes before looking at any model score, as a mix of
# likely-similar, likely-different and genuinely-uncertain pairs. None of them is a `data/sanity` pair,
# whose scores P1 had already seen — so this set is independent of both the frozen sanity set and the
# engine's output. The intended mix is recorded in docs/handoffs/data.md, deliberately NOT here, so that
# reading this file cannot bias a rater.
