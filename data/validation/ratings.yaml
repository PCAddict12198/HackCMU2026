# OWNER: data (P1). Pair-similarity study (H15): 20 core pairs rated 1-5 for "how similar do these taste?"
# The build report computes Spearman rho against the engine's percentile for each pair.
#
# ===> THE RATINGS BELOW ARE NOT HUMAN. The single rater key `claude` is an AI (Claude, the coding agent
# ===> that authored much of this corpus). The team chose this knowingly because no human study was run.
# ===> The report section is titled "Human ratings vs model" and averages every rater key, so until engine
# ===> adds a separate AI-baseline line (REQUEST filed in docs/handoffs/data.md) any rho it prints is an
# ===> AI baseline, NOT human validation. Label it that way on the validation slide.
#
# Two caveats that bound what this rho can mean:
#   1. NOT independent of the model. The rater authored or reviewed most of the ingredient profiles and
#      dish recipes the engine's scores are computed from, so agreement is partly self-agreement. A human
#      panel would be a genuinely independent test; this is not.
#   2. It IS blind to the output. The 20 pairs were chosen, and all 20 values below were fixed, before
#      anyone looked at a single model score for these pairs. No rating was revised afterwards.
# No published dataset could supply real ratings for these pairs: the public food-similarity sets
# (Yummly-10k triplets, FoodSense) rate images, not named dish pairs. Deriving them from the Ahn et al.
# flavor network was rejected on purpose — that is ingredient-compound overlap, so scoring our
# ingredient-based engine against it would inflate rho by construction.
#
# TO RUN THIS PROPERLY LATER: add one key per person (`ratings: {claude: 4, ishan: 3, ...}`) and the rho
# becomes a real mixed panel. Rate top to bottom on instinct, without opening the app first.
pairs:
  - {a: shoyu_ramen, b: pho_bo, ratings: {claude: 4}}
  - {a: bulgogi, b: char_siu, ratings: {claude: 4}}
